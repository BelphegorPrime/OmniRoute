name: Decision-model GHCR preview

# Deliberately branch-only and kept in the feature branch. Remove this file
# before opening the product PR so the preview pipeline is not part of it.
on:
  push:
    branches:
      - chore/decision-router-neutral

permissions:
  contents: read

concurrency:
  group: decision-model-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build feature image and publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/belphegorprime/omniroute
      IMAGE_TAG: decision-model-${{ github.sha }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push feature image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=decision-model-preview-amd64
          cache-to: type=gha,mode=max,scope=decision-model-preview-amd64

      - name: Add local test instructions
        env:
          IMAGE: ${{ env.IMAGE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          {
            printf '## Decision-model preview image\n\n'
            printf 'Built from `%s@%s` and pushed to GHCR: `%s:%s`.\n\n' "$REPOSITORY" "$SHA" "$IMAGE" "$IMAGE_TAG"
            printf 'If the package is private, authenticate to GHCR first with a token that has read:packages:\n'
            printf '%s\n' '`echo "$GHCR_TOKEN" | docker login ghcr.io -u YOUR_GITHUB_USERNAME --password-stdin`'
            printf '\nThen run locally (loopback-only port binding):\n'
            printf '`docker run -d --name omniroute-decision-preview -p 127.0.0.1:20128:20128 -v omniroute-decision-preview-data:/app/data %s:%s`\n' "$IMAGE" "$IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
